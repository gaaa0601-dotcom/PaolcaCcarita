<!DOCTYPE html>
<html lang="es">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Paola Alejandra Ccarita Apaza | Perfil</title>
<meta name="description" content="Administración de Redes y Telecomunicaciones. Mi LinkedIn, CV y contacto en un solo lugar.">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Fraunces:opsz,wght@9..144,600&family=Inter:wght@400;500;600&display=swap" rel="stylesheet">
<style>
  :root {
    --bg: #12060c;
    --bg2: #3a1230;
    --surface: rgba(34,12,26,.84);
    --text: #fdeaf1;
    --muted: #d6aebf;
    --line: #6a3050;
    --accent: #f08db0;
    --accent-text: #2a0d1e;
  }
  * { box-sizing: border-box; margin: 0; }
  html, body { min-height: 100%; }
  body {
    font-family: "Inter", system-ui, sans-serif;
    background: radial-gradient(ellipse at 50% 20%, var(--bg2), var(--bg) 75%) fixed;
    color: var(--text);
    position: relative;
    overflow-x: hidden;
    display: flex;
    justify-content: center;
    padding: 40px 20px;
  }
  main { width: 100%; max-width: 440px; position: relative; z-index: 1; }
  .lado { position: fixed; top: 0; z-index: 0; pointer-events: none; opacity: .9; }
  .lado svg { display: block; height: 100vh; width: auto; }
  .izq { left: 0; }
  .der { right: 0; transform: scale(-1,-1); }
  .tallo { fill: none; stroke: #2a7a63; stroke-width: 4; stroke-linecap: round; }
  .tallo.fino { stroke-width: 2.5; opacity: .75; }
  .paquete { fill: none; stroke: #ffb3cd; stroke-width: 2; stroke-linecap: round; stroke-dasharray: 1 22; animation: flujo 9s linear infinite; }
  .paquete.p2 { animation-duration: 12s; animation-direction: reverse; }
  @keyframes flujo { to { stroke-dashoffset: -230; } }
  .senal path { fill: none; stroke: #f08db0; stroke-width: 2; stroke-linecap: round; animation: senal 2.6s ease-in-out infinite; }
  .senal path:nth-child(2) { animation-delay: .3s; }
  .senal path:nth-child(3) { animation-delay: .6s; }
  @keyframes senal { 0%,100% { opacity: .15; } 40% { opacity: 1; } }
  .nodo { fill: #f08db0; animation: senal 3.2s ease-in-out infinite; }
  .perfil { text-align: center; margin-bottom: 30px; }
  .foto {
    width: 120px; height: 120px;
    border-radius: 50%;
    object-fit: cover;
    border: 4px solid var(--bg);
    box-shadow: 0 0 0 3px var(--accent), 0 0 24px rgba(240,141,176,.35);
    background: var(--line);
    margin-bottom: 18px;
  }
  h1 { font-family: "Fraunces", Georgia, serif; font-size: 1.9rem; line-height: 1.2; margin-bottom: 8px; }
  .rol { color: var(--muted); font-size: 1rem; line-height: 1.5; }
  .carrera {
    display: inline-flex; align-items: center; gap: 8px;
    margin-top: 14px; padding: 8px 16px;
    border: 1px solid var(--accent); border-radius: 999px;
    font-size: .85rem; font-weight: 500;
    background: var(--surface);
  }
  .carrera svg { width: 18px; height: 18px; fill: none; stroke: var(--accent); stroke-width: 2; stroke-linecap: round; }
  .enlaces { list-style: none; padding: 0; display: grid; gap: 14px; }
  .enlaces a {
    display: flex; align-items: center; gap: 14px;
    padding: 16px 20px;
    background: var(--surface);
    backdrop-filter: blur(6px);
    color: var(--text);
    text-decoration: none;
    font-weight: 500;
    border: 1px solid var(--line);
    border-radius: 999px;
    transition: border-color .15s, transform .15s;
  }
  .enlaces a:hover { border-color: var(--accent); transform: translateY(-2px); }
  .enlaces a:focus-visible, .correo a:focus-visible { outline: 3px solid var(--accent); outline-offset: 3px; }
  .enlaces svg { width: 24px; height: 24px; flex: none; fill: var(--accent); }
  .enlaces .cv { background: var(--accent); color: var(--accent-text); border-color: var(--accent); }
  .enlaces .cv svg { fill: var(--accent-text); }
  .correo { text-align: center; margin-top: 26px; }
  .correo a {
    display: inline-flex; align-items: center; gap: 8px;
    color: var(--text); font-size: .95rem; font-weight: 500;
    text-decoration: none; padding: 6px 8px;
    border-bottom: 1px solid var(--accent);
    background: var(--surface);
    overflow-wrap: anywhere;
  }
  .correo svg { width: 20px; height: 20px; flex: none; fill: none; stroke: var(--accent); stroke-width: 2; stroke-linecap: round; stroke-linejoin: round; }
  footer { text-align: center; margin-top: 28px; color: var(--muted); font-size: .85rem; }
  @media (prefers-reduced-motion: reduce) {
    .paquete, .senal path, .nodo { animation: none; opacity: .8; }
    .enlaces a { transition: none; }
    .enlaces a:hover { transform: none; }
  }
</style>
</head>
